name: Build and hardware-free tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MonitorSwitch.slnx
      - run: dotnet build MonitorSwitch.slnx -c Release --no-restore
      - run: dotnet test MonitorSwitch.slnx -c Release --no-build

  # The Mac helper is written and unit-tested on Windows, then built, tested and ad hoc signed here.
  # The artifact is run and validated on the Mac only in supervised sessions.
  mac-helper:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: swift build
      - run: swift test
      - run: swift build -c release --arch arm64
      - name: Sign and package
        run: |
          mkdir -p dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/monitor-switch-mac" dist/
          codesign --force --sign - --identifier monitor-switch-mac dist/monitor-switch-mac
          codesign --verify --verbose dist/monitor-switch-mac
          sh scripts/make-bundles.sh dist/monitor-switch-mac dist "$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/MonitorSwitchMacCore/App.swift)"
          # tar keeps the executable bit and bundle layout, which artifact zips drop.
          tar -czf monitor-switch-mac.tar.gz -C dist monitor-switch-mac MonitorSwitch.app "MonitorSwitch Probe.app"
          shasum -a 256 dist/monitor-switch-mac dist/MonitorSwitch.app/Contents/MacOS/monitor-switch-mac monitor-switch-mac.tar.gz | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-switch-mac-${{ github.sha }}
          path: |
            mac/monitor-switch-mac.tar.gz
            mac/SHA256SUMS.txt
          retention-days: 14
